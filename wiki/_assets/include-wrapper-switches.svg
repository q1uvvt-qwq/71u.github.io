<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowO" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="980" height="720" fill="#fafafa"/>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">allow_url_fopen 与 allow_url_include：两个开关各管什么</text>
  <text x="490" y="58" text-anchor="middle" font-size="12.5" fill="#6b7280">一个管「能不能打开远程流」，一个管「能不能把远程内容当 PHP 执行」</text>

  <!-- left switch -->
  <rect x="40" y="88" width="430" height="208" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="255" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">allow_url_fopen</text>
  <text x="255" y="142" text-anchor="middle" font-size="12" fill="#1e40af">管「打开」—— 面向文件系统函数</text>
  <text x="60" y="172" font-size="11.5" fill="#1e40af">受控函数：fopen() / file_get_contents()</text>
  <text x="80" y="192" font-size="11.5" fill="#1e40af">readfile() / file() / copy() / fread()</text>
  <text x="60" y="222" font-size="11.5" fill="#1e40af">作用：决定这些函数能否以 http:// ftp://</text>
  <text x="80" y="242" font-size="11.5" fill="#1e40af">data:// 等远程 / 内联包装器作为数据源</text>
  <text x="60" y="272" font-size="12" font-weight="bold" fill="#1d4ed8">默认值：On</text>

  <!-- right switch -->
  <rect x="510" y="88" width="430" height="208" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="725" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">allow_url_include</text>
  <text x="725" y="142" text-anchor="middle" font-size="12" fill="#991b1b">管「包含执行」—— 面向包含函数</text>
  <text x="530" y="172" font-size="11.5" fill="#991b1b">受控函数：include() / include_once()</text>
  <text x="550" y="192" font-size="11.5" fill="#991b1b">require() / require_once()</text>
  <text x="530" y="222" font-size="11.5" fill="#991b1b">作用：决定这些函数能否把 http:// data://</text>
  <text x="550" y="242" font-size="11.5" fill="#991b1b">php://input 的内容当 PHP 代码执行</text>
  <text x="530" y="272" font-size="12" font-weight="bold" fill="#b91c1c">默认值：Off</text>

  <!-- dependency -->
  <rect x="140" y="316" width="700" height="58" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <path d="M255,300 L255,312" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#arrowO)"/>
  <path d="M725,300 L725,312" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#arrowO)"/>
  <text x="490" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#78350f">依赖关系：allow_url_include 是 allow_url_fopen 的特化版本</text>
  <text x="490" y="362" text-anchor="middle" font-size="11.5" fill="#92400e">allow_url_fopen=Off 时，即使 allow_url_include=On，远程包含同样不可用</text>

  <!-- table -->
  <rect x="40" y="400" width="900" height="28" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="60" y="419" font-size="12" font-weight="bold" fill="#374151">包装器 / 协议</text>
  <text x="320" y="419" font-size="12" font-weight="bold" fill="#374151">用于 include 等包含函数时的条件</text>
  <text x="620" y="419" font-size="12" font-weight="bold" fill="#374151">说明</text>

  <rect x="40" y="428" width="900" height="30" fill="#f0fdf4" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="448" font-size="11.5" fill="#14532d" font-family="monospace">file://</text>
  <text x="320" y="448" font-size="11.5" fill="#166534">无条件可用</text>
  <text x="620" y="448" font-size="11.5" fill="#166534">访问本地文件系统，等价于直接写路径</text>

  <rect x="40" y="458" width="900" height="30" fill="#f0fdf4" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="478" font-size="11.5" fill="#14532d" font-family="monospace">php://filter</text>
  <text x="320" y="478" font-size="11.5" fill="#166534">无条件可用</text>
  <text x="620" y="478" font-size="11.5" fill="#166534">读源码利器，include 下照常工作（最常用）</text>

  <rect x="40" y="488" width="900" height="30" fill="#fef2f2" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="508" font-size="11.5" fill="#7f1d1d" font-family="monospace">php://input</text>
  <text x="320" y="508" font-size="11.5" fill="#b91c1c">需要 allow_url_include=On</text>
  <text x="620" y="508" font-size="11.5" fill="#b91c1c">把 POST 请求体原文当 PHP 执行</text>

  <rect x="40" y="518" width="900" height="30" fill="#fef2f2" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="538" font-size="11.5" fill="#7f1d1d" font-family="monospace">data://</text>
  <text x="320" y="538" font-size="11.5" fill="#b91c1c">需要 allow_url_include=On</text>
  <text x="620" y="538" font-size="11.5" fill="#b91c1c">代码直接内联在 URL 里，无需外部文件</text>

  <rect x="40" y="548" width="900" height="30" fill="#fef2f2" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="568" font-size="11.5" fill="#7f1d1d" font-family="monospace">http:// / https://</text>
  <text x="320" y="568" font-size="11.5" fill="#b91c1c">需要 allow_url_include=On</text>
  <text x="620" y="568" font-size="11.5" fill="#b91c1c">经典 RFI：从远程服务器拉代码执行</text>

  <rect x="40" y="578" width="900" height="30" fill="#fef2f2" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="598" font-size="11.5" fill="#7f1d1d" font-family="monospace">ftp:// / ftps://</text>
  <text x="320" y="598" font-size="11.5" fill="#b91c1c">需要 allow_url_include=On</text>
  <text x="620" y="598" font-size="11.5" fill="#b91c1c">从 FTP 服务器拉代码执行</text>

  <rect x="40" y="608" width="900" height="30" fill="#fff7ed" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="628" font-size="11.5" fill="#78350f" font-family="monospace">zlib:// phar:// zip:// glob:// expect://</text>
  <text x="320" y="628" font-size="11.5" fill="#92400e">视环境与扩展而定</text>
  <text x="620" y="628" font-size="11.5" fill="#92400e">多用于文件系统函数；用于 include 时受限</text>

  <text x="490" y="668" text-anchor="middle" font-size="12" fill="#374151">判据口诀：file:// 与 php://filter「永远能用」；其余远程 / 内联包装器「都要先过 allow_url_include」</text>
  <text x="490" y="692" text-anchor="middle" font-size="11.5" fill="#6b7280">allow_url_include 默认 Off → 真实环境中 RFI 少见，LFI + php://filter 才是主战场</text>
</svg>
