<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="980" height="600" fill="#fafafa"/>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">php://filter 过滤器链如何改造字节流</text>
  <text x="490" y="58" text-anchor="middle" font-size="12.5" fill="#6b7280">过滤器用 | 串成管道，前一个的输出就是后一个的输入</text>

  <!-- row 1 -->
  <rect x="30" y="98" width="280" height="92" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="170" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#374151">resource 原始字节</text>
  <text x="170" y="146" text-anchor="middle" font-size="11.5" fill="#4b5563" font-family="monospace">&lt;?php system(...); ?&gt;</text>
  <text x="170" y="168" text-anchor="middle" font-size="11" fill="#6b7280">含 PHP 开标签 → 可被执行</text>

  <rect x="340" y="98" width="280" height="92" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="480" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#312e81">单个过滤器</text>
  <text x="480" y="146" text-anchor="middle" font-size="11.5" fill="#3730a3" font-family="monospace">convert.base64-encode</text>
  <text x="480" y="168" text-anchor="middle" font-size="11" fill="#4338ca">把字节整体换一种「表示法」</text>

  <rect x="650" y="98" width="300" height="92" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.6"/>
  <text x="800" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">输出字节（纯 ASCII）</text>
  <text x="800" y="146" text-anchor="middle" font-size="11.5" fill="#166534" font-family="monospace">PD9waHAgc3lzdGVtKC4uLik7Pz4=</text>
  <text x="800" y="168" text-anchor="middle" font-size="11" fill="#15803d">不含 &lt; ? &gt; → 不可执行 → 原样输出</text>

  <path d="M310,144 L336,144" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M620,144 L646,144" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="490" y="216" text-anchor="middle" font-size="11.5" fill="#6b7280">效果：include 拿到 base64 文本 → 不是有效 PHP → 原样吐给浏览器 → 解码即得源码</text>

  <!-- row 2 -->
  <rect x="30" y="252" width="280" height="112" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="170" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#374151">同一份原始字节</text>
  <text x="170" y="300" text-anchor="middle" font-size="11.5" fill="#4b5563" font-family="monospace">&lt;?php ... ?&gt;</text>
  <text x="170" y="322" text-anchor="middle" font-size="11" fill="#6b7280">UTF-8，每个 ASCII 字符 1 字节</text>
  <text x="170" y="344" text-anchor="middle" font-size="11" fill="#6b7280">字节序列：3C 3F 70 68 70</text>

  <rect x="340" y="252" width="280" height="112" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="480" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#312e81">过滤器链（两个 convert.iconv）</text>
  <text x="480" y="300" text-anchor="middle" font-size="11.5" fill="#3730a3" font-family="monospace">convert.iconv.UCS-2LE.UCS-2BE</text>
  <text x="480" y="322" text-anchor="middle" font-size="11" fill="#4338ca">↓ 再按另一字节序读一遍</text>
  <text x="480" y="344" text-anchor="middle" font-size="11.5" fill="#3730a3" font-family="monospace">convert.iconv.UCS-2BE.UCS-2LE</text>

  <rect x="650" y="252" width="300" height="112" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.6"/>
  <text x="800" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#831843">输出字节被「撕裂」</text>
  <text x="800" y="300" text-anchor="middle" font-size="11.5" fill="#9d174d" font-family="monospace">3C 00 3F 00 70 00 68 00 70</text>
  <text x="800" y="322" text-anchor="middle" font-size="11" fill="#9d174d">每个 ASCII 字符后插入 0x00 空字节</text>
  <text x="800" y="344" text-anchor="middle" font-size="11" fill="#9d174d">开标签被撕开 → PHP 认不出来</text>

  <path d="M310,308 L336,308" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M620,308 L646,308" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="490" y="388" text-anchor="middle" font-size="11.5" fill="#6b7280">效果：结构被破坏 → 既执行不了，又能被 highlight_file() / echo 原样显示出来</text>

  <!-- bottom -->
  <rect x="80" y="418" width="820" height="158" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="490" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">为什么过滤器链能绕过 WAF / 被过滤的关键词</text>
  <text x="110" y="476" font-size="11.5" fill="#92400e">1. 它改的是「字节流」而不是参数名：黑名单只认关键词，认不出编码变换后的等价内容</text>
  <text x="110" y="500" font-size="11.5" fill="#92400e">2. 黑名单常常只列了 rot13 / base64 / string，却漏掉 convert.iconv.* —— 这就是绕过口</text>
  <text x="110" y="524" font-size="11.5" fill="#92400e">3. 链可以任意长，用 | 拼接，逐步把敏感内容变形到完全不可识别</text>
  <text x="110" y="548" font-size="11.5" fill="#92400e">4. 同样地，当程序用 exit()/die() 拦截直接包含时，先用过滤器把内容变成「无害文本」再输出</text>
  <text x="110" y="572" font-size="11" fill="#a16207">提示：构造链不需要背下来，先确定「目标内容长什么样」，再挑一个能把开标签打散的过滤器组合即可</text>
</svg>
