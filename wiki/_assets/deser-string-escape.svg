<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#fafafa"/>

  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">字符逃逸：长度字段与实际内容不一致，边界就移位了</text>
  <text x="480" y="52" text-anchor="middle" font-size="12.5" fill="#6b7280">序列化格式是 s:长度:"内容"; —— 解析器只按「长度」数格子，从不回头核对内容真实有多长</text>

  <!-- ============ 上半：变短 ============ -->
  <rect x="30" y="68" width="900" height="244" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="52" y="94" font-size="14.5" font-weight="bold" fill="#0f172a">变短（逃逸）：声明长度 &gt; 实际内容　→　解析器向后「多吃」，把后面的结构吞进字符串</text>
  <text x="52" y="115" font-size="12" fill="#475569">典型来源：过滤把关键字删掉，如 str_replace('flag','',$s) —— 内容变短，但 s:16 还是老数字</text>

  <!-- 变短行 -->
  <rect x="52" y="132" width="86" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="95" y="157" text-anchor="middle" font-size="12.5" font-family="Consolas,monospace" fill="#1e3a8a">s:16:"</text>

  <rect x="140" y="132" width="150" height="40" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="215" y="151" text-anchor="middle" font-size="11.5" fill="#991b1b">过滤后 = 0 字节</text>
  <text x="215" y="166" text-anchor="middle" font-size="10.5" fill="#b91c1c">(4 个 flag 共 16 字节被删)</text>

  <rect x="292" y="132" width="238" height="40" rx="5" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="411" y="151" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#713f12">被顺手「吃」进来的 16 字节</text>
  <text x="411" y="166" text-anchor="middle" font-size="11.5" font-family="Consolas,monospace" fill="#854d0e">";s:1:"b";s:24:"</text>

  <rect x="532" y="132" width="252" height="40" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="658" y="151" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">b 的注入内容升格成「结构」</text>
  <text x="658" y="166" text-anchor="middle" font-size="11.5" font-family="Consolas,monospace" fill="#166534">";s:1:"b";s:6:"hacker";}</text>

  <path d="M290,152 L288,152" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)" fill="none"/>
  <path d="M530,152 L530,152" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>

  <!-- 读取窗口标注 -->
  <path d="M52,186 L215,186" stroke="#3b82f6" stroke-width="1.6" fill="none"/>
  <path d="M52,180 L52,192" stroke="#3b82f6" stroke-width="1.6" fill="none"/>
  <path d="M215,180 L215,192" stroke="#3b82f6" stroke-width="1.6" fill="none"/>
  <text x="133" y="203" text-anchor="middle" font-size="11" fill="#1d4ed8">解析器要读的 16 字节从这里开始</text>

  <text x="52" y="240" font-size="12" fill="#334155">结果：a 的值变成</text>
  <rect x="112" y="226" width="176" height="20" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="200" y="241" text-anchor="middle" font-size="11.5" font-family="Consolas,monospace" fill="#0f172a">";s:1:"b";s:24:"</text>
  <text x="300" y="240" font-size="12" fill="#334155">，解析器接着就把 b 的内容当成属性定义来读 → b = hacked 值。</text>

  <text x="52" y="272" font-size="12" fill="#b91c1c" font-weight="bold">记忆点：内容变短 → 解析器「多吃」后面的 ;";} 等结构字符（这正是「吃掉后续 ;}」的说法来源）。</text>
  <text x="52" y="294" font-size="11.5" fill="#64748b">对照实验：a = 'flag'×4，b = '";s:1:"b";s:6:"hacker";}'，PHP 实测得到 a = '";s:1:"b";s:24:"'、b = 'hacker'。</text>

  <!-- ============ 下半：增多 ============ -->
  <rect x="30" y="326" width="900" height="252" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="52" y="352" font-size="14.5" font-weight="bold" fill="#0f172a">增多：声明长度 &lt; 实际内容　→　解析器提前读满，多出来的「尾巴」溢出成结构</text>
  <text x="52" y="373" font-size="12" fill="#475569">典型来源：过滤把关键字换长，如 str_replace('fuck','loveU',$s) —— 每个 fuck 多 1 字节（ctfshow web262）</text>

  <rect x="52" y="392" width="96" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="100" y="417" text-anchor="middle" font-size="12.5" font-family="Consolas,monospace" fill="#1e3a8a">s:135:"</text>

  <rect x="150" y="392" width="330" height="40" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="315" y="411" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3730a3">loveU × 27 = 135 字节，正好占满声明长度</text>
  <text x="315" y="426" text-anchor="middle" font-size="10.5" fill="#4338ca">原始 27 个 fuck 共 108 字节，被换长后变 135</text>

  <rect x="482" y="392" width="252" height="40" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="608" y="411" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">多出的 27 字节尾巴</text>
  <text x="608" y="426" text-anchor="middle" font-size="11.5" font-family="Consolas,monospace" fill="#166534">";s:5:"token";s:5:"admin";}</text>

  <rect x="736" y="392" width="48" height="40" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="760" y="417" text-anchor="middle" font-size="11.5" font-family="Consolas,monospace" fill="#475569">";}</text>

  <path d="M480,412 L478,412" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>

  <path d="M150,446 L480,446" stroke="#22c55e" stroke-width="1.6" fill="none"/>
  <path d="M150,440 L150,452" stroke="#22c55e" stroke-width="1.6" fill="none"/>
  <path d="M480,440 L480,452" stroke="#22c55e" stroke-width="1.6" fill="none"/>
  <text x="315" y="463" text-anchor="middle" font-size="11" fill="#15803d">解析器读满 135 字节就收工，字符串到此为止</text>

  <text x="52" y="500" font-size="12" fill="#334155">结果：字符串被「读短」了，后面的 27 字节落到引号外面，被当成新的属性继续解析 →</text>
  <rect x="52" y="512" width="330" height="22" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.2"/>
  <text x="217" y="528" text-anchor="middle" font-size="11.5" font-family="Consolas,monospace" fill="#14532d">token = "admin"（原来的 user 被顶掉）</text>

  <text x="52" y="558" font-size="12" fill="#15803d" font-weight="bold">记忆点：内容变长 → 解析器「提前收工」，多出来的尾部溢出成结构（payload 放尾部即可）。</text>

  <!-- 底部结论条 -->
  <rect x="150" y="600" width="660" height="72" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="480" y="624" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">同一个根因的两个方向</text>
  <text x="480" y="646" text-anchor="middle" font-size="12" fill="#92400e">解析器只信「长度字段」，所以：serialize → str_replace → unserialize 这个顺序本身就是漏洞。</text>
  <text x="480" y="664" text-anchor="middle" font-size="12" fill="#92400e">安全写法是先替换再序列化（str_replace → serialize），让长度字段与内容始终一致。</text>
</svg>
