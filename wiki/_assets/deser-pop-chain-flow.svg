<svg xmlns="http://www.w3.org/2000/svg" width="940" height="748" viewBox="0 0 940 748" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="940" height="748" fill="#fafafa"/>

  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">POP 链调用流向：从入口魔术方法一路走到危险函数</text>
  <text x="470" y="55" text-anchor="middle" font-size="12.5" fill="#6b7280">对象的方法代码改不了，但「属性值」完全由序列化数据决定 —— 于是每一次「下一步调用谁」都被攻击者写死</text>

  <!-- 1 -->
  <rect x="270" y="76" width="400" height="58" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="470" y="99" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">① 攻击者：构造序列化字符串</text>
  <text x="470" y="119" text-anchor="middle" font-size="11.5" fill="#1e40af">O:5:"index":1:{s:11:"\0index\0test";O:4:"evil":1:{s:5:"test2";...;}}</text>

  <path d="M470,134 L470,164" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" fill="none"/>

  <!-- 2 -->
  <rect x="270" y="166" width="400" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="470" y="189" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">② unserialize($_GET['test'])</text>
  <text x="470" y="209" text-anchor="middle" font-size="11.5" fill="#475569">按数据里声明的类名实例化对象，并把属性填回去</text>

  <path d="M470,224 L470,254" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" fill="none"/>

  <!-- 3 对象图 -->
  <rect x="150" y="256" width="640" height="86" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="470" y="279" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4c1d95">③ 内存里长出一张「对象图」（攻击者说了算）</text>
  <rect x="180" y="292" width="230" height="38" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="295" y="316" text-anchor="middle" font-size="12" fill="#4c1d95">index 对象　$test = →</text>
  <rect x="530" y="292" width="230" height="38" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="645" y="316" text-anchor="middle" font-size="12" fill="#4c1d95">evil 对象　$test2 = 命令串</text>
  <path d="M412,311 L526,311" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow)" fill="none"/>

  <path d="M470,342 L470,372" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" fill="none"/>

  <!-- 4 -->
  <rect x="270" y="374" width="400" height="58" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.6"/>
  <text x="470" y="397" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#713f12">④ 脚本结束 → 对象被销毁</text>
  <text x="470" y="417" text-anchor="middle" font-size="11.5" fill="#854d0e">析构函数 __destruct() 自动执行（不需要攻击者再动手）</text>

  <path d="M470,432 L470,462" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)" fill="none"/>

  <!-- 5 -->
  <rect x="270" y="464" width="400" height="58" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="470" y="487" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#991b1b">⑤ index::__destruct()</text>
  <text x="470" y="507" text-anchor="middle" font-size="11.5" fill="#b91c1c">$this-&gt;test-&gt;action();  ← $test 已经是 evil 对象</text>

  <path d="M470,522 L470,552" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)" fill="none"/>

  <!-- 6 -->
  <rect x="270" y="554" width="400" height="58" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="470" y="577" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#991b1b">⑥ evil::action()</text>
  <text x="470" y="597" text-anchor="middle" font-size="11.5" fill="#b91c1c">eval($this-&gt;test2);  ← 危险函数就位</text>

  <path d="M470,612 L470,642" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)" fill="none"/>

  <!-- 7 -->
  <rect x="270" y="644" width="400" height="52" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="470" y="668" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">⑦ 命令执行 / 代码执行</text>
  <text x="470" y="687" text-anchor="middle" font-size="11.5" fill="#991b1b">system("whoami") —— 拿到 flag 的最后一步</text>

  <!-- 左侧注解 -->
  <path d="M150,505 L96,505" stroke="#2563eb" stroke-width="1.4" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="88" y="470" text-anchor="end" font-size="12" fill="#1d4ed8">每一跳的</text>
  <text x="88" y="488" text-anchor="end" font-size="12" fill="#1d4ed8">「调用谁」</text>
  <text x="88" y="506" text-anchor="end" font-size="12" fill="#1d4ed8">都由属性值决定</text>
  <text x="88" y="524" text-anchor="end" font-size="11" fill="#3b82f6">（所以属性必须可控）</text>

  <!-- 右侧注解：构造顺序 -->
  <path d="M670,583 L762,583" stroke="#2563eb" stroke-width="1.4" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="770" y="536" font-size="12" fill="#1d4ed8">构造时是从下往上推：</text>
  <text x="770" y="556" font-size="12" fill="#1d4ed8">先找危险函数（eval），</text>
  <text x="770" y="576" font-size="12" fill="#1d4ed8">再看谁能调它（action），</text>
  <text x="770" y="596" font-size="12" fill="#1d4ed8">再找谁自动调 action</text>
  <text x="770" y="616" font-size="12" fill="#1d4ed8">（__destruct），最后</text>
  <text x="770" y="636" font-size="12" fill="#1d4ed8">把属性串成一条链。</text>

  <!-- 底部结论 -->
  <rect x="200" y="706" width="540" height="34" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="470" y="728" text-anchor="middle" font-size="12.5" fill="#78350f">入口 = 反序列化后一定会自动触发的魔术方法；出口 = 危险函数；中间用属性把对象一个个串起来</text>
</svg>
