<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="620" viewBox="0 0 1020 620" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="1020" height="620" fill="#f6f8fc"/>

  <text x="510" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#16233d">SQL 注入过滤绕过决策树</text>
  <text x="510" y="64" text-anchor="middle" font-size="14" fill="#5b6b85">先定位「哪个元素被过滤」，再套用等价的替代写法</text>

  <rect x="400" y="86" width="220" height="54" rx="10" fill="#2f6fed"/>
  <text x="510" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">payload 被拦 / 无回显</text>
  <text x="510" y="130" text-anchor="middle" font-size="12" fill="#dbe6ff">逐项排除：空格？关键字？引号？注释？输出？</text>

  <line x1="510" y1="140" x2="510" y2="160" stroke="#9aabc7" stroke-width="2"/>
  <line x1="112" y1="160" x2="908" y2="160" stroke="#9aabc7" stroke-width="2"/>
  <line x1="112" y1="160" x2="112" y2="178" stroke="#9aabc7" stroke-width="2"/>
  <line x1="311" y1="160" x2="311" y2="178" stroke="#9aabc7" stroke-width="2"/>
  <line x1="510" y1="160" x2="510" y2="178" stroke="#9aabc7" stroke-width="2"/>
  <line x1="709" y1="160" x2="709" y2="178" stroke="#9aabc7" stroke-width="2"/>
  <line x1="908" y1="160" x2="908" y2="178" stroke="#9aabc7" stroke-width="2"/>

  <rect x="24" y="178" width="176" height="46" rx="8" fill="#e8590c"/>
  <text x="112" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">① 空格被过滤</text>
  <rect x="24" y="236" width="176" height="190" rx="8" fill="#ffffff" stroke="#e9c3a9"/>
  <text x="38" y="262" font-size="12.5" fill="#33415c">/**/ 内联注释</text>
  <text x="38" y="292" font-size="12.5" fill="#33415c">%09 %0a %0b %0c %0d</text>
  <text x="38" y="322" font-size="12.5" fill="#33415c">%a0（特定字符集）</text>
  <text x="38" y="352" font-size="12.5" fill="#33415c">() 括号包裹</text>
  <text x="38" y="382" font-size="12.5" fill="#33415c">` 反引号包裹</text>
  <text x="38" y="412" font-size="12.5" fill="#7b8794">web177-180</text>

  <rect x="223" y="178" width="176" height="46" rx="8" fill="#7048e8"/>
  <text x="311" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">② 关键字被过滤</text>
  <rect x="223" y="236" width="176" height="190" rx="8" fill="#ffffff" stroke="#cfc4ee"/>
  <text x="237" y="262" font-size="12.5" fill="#33415c">大小写：SeLeCt</text>
  <text x="237" y="292" font-size="12.5" fill="#33415c">内联注释：/**/select</text>
  <text x="237" y="322" font-size="12.5" fill="#33415c">同义替换：where→having</text>
  <text x="237" y="352" font-size="12.5" fill="#33415c">十六进制：0x63746625</text>
  <text x="237" y="382" font-size="12.5" fill="#33415c">反引号：`select`</text>
  <text x="237" y="412" font-size="12.5" fill="#7b8794">web176 / web184</text>

  <rect x="422" y="178" width="176" height="46" rx="8" fill="#0c8599"/>
  <text x="510" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">③ 引号被过滤</text>
  <rect x="422" y="236" width="176" height="190" rx="8" fill="#ffffff" stroke="#a8dbe3"/>
  <text x="436" y="262" font-size="12.5" fill="#33415c">十六进制：0x63746625</text>
  <text x="436" y="292" font-size="12.5" fill="#33415c">char()/chr() + concat</text>
  <text x="436" y="322" font-size="12.5" fill="#33415c">表达式凑数：true+true</text>
  <text x="436" y="352" font-size="12.5" fill="#33415c">精确闭合，不写字符串</text>
  <text x="436" y="382" font-size="12.5" fill="#33415c">like 通配符代替 =</text>
  <text x="436" y="412" font-size="12.5" fill="#7b8794">web184 / web185</text>

  <rect x="621" y="178" width="176" height="46" rx="8" fill="#c2255c"/>
  <text x="709" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">④ 注释符被过滤</text>
  <rect x="621" y="236" width="176" height="190" rx="8" fill="#ffffff" stroke="#eeb6cb"/>
  <text x="635" y="262" font-size="12.5" fill="#33415c"># / %23</text>
  <text x="635" y="292" font-size="12.5" fill="#33415c">--%0c（非标准空白）</text>
  <text x="635" y="322" font-size="12.5" fill="#33415c">精确闭合，去掉注释</text>
  <text x="635" y="352" font-size="12.5" fill="#33415c">; 分号截断</text>
  <text x="635" y="382" font-size="12.5" fill="#33415c">--+ / --%20</text>
  <text x="635" y="412" font-size="12.5" fill="#7b8794">web180</text>

  <rect x="820" y="178" width="176" height="46" rx="8" fill="#2b8a3e"/>
  <text x="908" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">⑤ 输出被过滤</text>
  <rect x="820" y="236" width="176" height="190" rx="8" fill="#ffffff" stroke="#a9d6b5"/>
  <text x="834" y="262" font-size="12.5" fill="#33415c">hex() / to_base64()</text>
  <text x="834" y="292" font-size="12.5" fill="#33415c">只回显无过滤的列</text>
  <text x="834" y="322" font-size="12.5" fill="#33415c">into outfile 写文件</text>
  <text x="834" y="352" font-size="12.5" fill="#33415c">报错 / 时间盲注带出</text>
  <text x="834" y="382" font-size="12.5" fill="#33415c">replace 换字符集</text>
  <text x="834" y="412" font-size="12.5" fill="#7b8794">web172 / web173-175</text>

  <rect x="24" y="452" width="972" height="118" rx="10" fill="#eef3fb" stroke="#c9d8ef"/>
  <text x="44" y="480" font-size="14" font-weight="bold" fill="#1f2a44">排查顺序（省时间的做法）</text>
  <text x="44" y="506" font-size="13" fill="#33415c">1. 先原样发一个不含空格的最简 payload（如 -1'union%09select%091,2,3%09%23），看是「语法报错」还是「被拦」。</text>
  <text x="44" y="528" font-size="13" fill="#33415c">2. 语法报错 → 是闭合/注释问题；被 WAF 拦截（403/固定提示）→ 是关键字或字符过滤，换等价写法。</text>
  <text x="44" y="550" font-size="13" fill="#33415c">3. 查询成功但看不到数据 → 是输出侧过滤，改用编码、换列或 into outfile 带出。</text>
</svg>
