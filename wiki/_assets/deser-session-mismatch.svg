<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#fafafa"/>

  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">Session 反序列化：存储格式与解析格式不一致 → 错位拆分 → 对象注入</text>
  <text x="480" y="52" text-anchor="middle" font-size="12.5" fill="#6b7280">session_start() 内部就是一次反序列化；两种 handler 一个用「|」一个不用，混用就出事</text>

  <!-- ===== 第一段：两种 handler ===== -->
  <rect x="30" y="68" width="430" height="152" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="50" y="94" font-size="14" font-weight="bold" fill="#1e3a8a">handler = php（默认）</text>
  <text x="50" y="116" font-size="11.5" fill="#1d4ed8">每个变量写成「键 + | + 序列化值」</text>
  <rect x="50" y="128" width="390" height="30" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="62" y="148" font-size="12" font-family="Consolas,monospace" fill="#1e3a8a">username|s:5:"admin";</text>
  <text x="50" y="180" font-size="11.5" fill="#1e40af">靠「|」切分「键 / 值」，再对值做 unserialize()</text>
  <text x="50" y="202" font-size="11.5" font-weight="bold" fill="#b91c1c">用到了 | 这个分隔符</text>

  <rect x="500" y="68" width="430" height="152" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
  <text x="520" y="94" font-size="14" font-weight="bold" fill="#14532d">handler = php_serialize</text>
  <text x="520" y="116" font-size="11.5" fill="#166534">把整个 session 数组「整体」序列化一次</text>
  <rect x="520" y="128" width="390" height="30" rx="5" fill="#ffffff" stroke="#86efac" stroke-width="1.1"/>
  <text x="532" y="148" font-size="12" font-family="Consolas,monospace" fill="#14532d">a:1:{s:8:"username";s:5:"admin";}</text>
  <text x="520" y="180" font-size="11.5" fill="#15803d">读的时候直接整体 unserialize()，不逐个拆</text>
  <text x="520" y="202" font-size="11.5" font-weight="bold" fill="#b91c1c">完全不使用 | 这个分隔符</text>

  <!-- ===== 第二段：错位解析 ===== -->
  <rect x="30" y="236" width="900" height="236" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="50" y="262" font-size="14" font-weight="bold" fill="#0f172a">写入用 php_serialize、读取用 php　→　PHP 从 | 处「错位拆分」</text>

  <text x="50" y="288" font-size="11.5" fill="#475569">session 文件里实际存着（php_serialize 写入，值里带了攻击者可控的一个 |）：</text>
  <rect x="50" y="298" width="860" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="64" y="320" font-size="12" font-family="Consolas,monospace" fill="#0f172a">a:1:{s:10:"PHP_SESSION_UPLOAD_PROGRESS";s:44:"|O:4:"User":2:{s:8:"username";...</text>
  <text x="64" y="340" font-size="12" font-family="Consolas,monospace" fill="#0f172a">...;}";}</text>

  <!-- 切分点标注 -->
  <path d="M497,298 L497,370" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5 3" fill="none"/>
  <text x="497" y="390" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">↑ php handler 在这里切</text>

  <rect x="50" y="400" width="420" height="56" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="62" y="420" font-size="11.5" font-weight="bold" fill="#374151">「键名」：被当成垃圾忽略</text>
  <text x="62" y="440" font-size="11" font-family="Consolas,monospace" fill="#4b5563">a:1:{s:10:"PHP_SESSION_UPLOAD_PROGRESS";s:44:"</text>

  <path d="M470,428 L500,428" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <rect x="504" y="392" width="406" height="72" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="516" y="412" font-size="11.5" font-weight="bold" fill="#991b1b">「值」：被拿去 unserialize()</text>
  <text x="516" y="432" font-size="11.5" font-family="Consolas,monospace" fill="#b91c1c">O:4:"User":2:{s:8:"username";s:5:"admin";...}</text>
  <text x="516" y="452" font-size="11.5" font-weight="bold" fill="#b91c1c">★ 攻击者的序列化串在这里生效</text>

  <!-- ===== 第三段：结果 ===== -->
  <rect x="30" y="486" width="900" height="82" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.4"/>
  <text x="50" y="512" font-size="13.5" font-weight="bold" fill="#881337">结果：PHP 隐式调用 unserialize() → 造出 User 对象</text>
  <text x="50" y="534" font-size="12" fill="#9f1239">脚本结束 → 触发 __destruct()（或 __wakeup / __unserialize）→ 走到 exit 出口，如 file_put_contents 写文件</text>
  <text x="50" y="556" font-size="12" fill="#9f1239">注意：源码里通常「看不到」unserialize() —— 它藏在 session_start() 里面。</text>

  <!-- ===== 底部：触发条件 ===== -->
  <rect x="130" y="588" width="700" height="96" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="480" y="612" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">触发反序列化的三个必要条件</text>
  <text x="480" y="636" text-anchor="middle" font-size="12" fill="#92400e">① 写入用 php_serialize　② 读取用 php　③ 攻击者能控制 session 的一部分内容</text>
  <text x="480" y="658" text-anchor="middle" font-size="12" fill="#92400e">常见入口：session.upload_progress（文件名可控）　另外：只「存」不够，必须「再读一次」才触发</text>
</svg>
