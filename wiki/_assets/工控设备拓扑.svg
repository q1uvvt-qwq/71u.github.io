<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="monospace">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" fill="#333" letter-spacing="1">风电场景 工控设备拓扑</text>
  <line x1="140" y1="52" x2="760" y2="52" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <text x="450" y="72" text-anchor="middle" font-size="12" fill="#888">SCADA/HMI → 通信网关 → RTU/PLC → 风机　（旁挂 Historian · 工程师站 · 校验节点）</text>

  <!-- main vertical spine -->
  <!-- SCADA/HMI -->
  <g transform="rotate(-0.4 300 130)">
    <rect x="160" y="98" width="280" height="66" fill="#2c7fb8" fill-opacity="0.08" stroke="#2c7fb8" stroke-width="2.2" rx="6"/>
    <text x="300" y="126" text-anchor="middle" font-size="15" fill="#2c7fb8">SCADA / HMI 监控层</text>
    <text x="300" y="148" text-anchor="middle" font-size="11" fill="#666">plain-scada-hmi 10.0.8.3:8080</text>
  </g>

  <line x1="300" y1="164" x2="300" y2="206" stroke="#333" stroke-width="2" marker-end="url(#a2)"/>
  <text x="310" y="190" font-size="10" fill="#888">HTTP / 轮询</text>

  <!-- report portal off to the side (management) -->
  <g transform="rotate(0.5 660 130)">
    <rect x="530" y="98" width="250" height="66" fill="#d9534f" fill-opacity="0.06" stroke="#d9534f" stroke-width="2" stroke-dasharray="7 5" rx="6"/>
    <text x="655" y="126" text-anchor="middle" font-size="14" fill="#d9534f">报表门户 10.0.7.10:8080</text>
    <text x="655" y="148" text-anchor="middle" font-size="11" fill="#888">SQL 注入 / IDOR 入口</text>
  </g>
  <line x1="530" y1="131" x2="442" y2="131" stroke="#d9534f" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- Gateway -->
  <g transform="rotate(0.35 300 262)">
    <rect x="160" y="210" width="280" height="76" fill="#333" fill-opacity="0.05" stroke="#333" stroke-width="2.4" rx="6"/>
    <text x="300" y="238" text-anchor="middle" font-size="15" fill="#333">通信网关 communication-system-1</text>
    <text x="300" y="259" text-anchor="middle" font-size="11" fill="#666">plain_scada_gateway 10.0.6.8</text>
    <text x="300" y="277" text-anchor="middle" font-size="11" fill="#d9534f">诊断入口 plain_diag + gateway_diag_key.pem</text>
  </g>
  <text x="130" y="252" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 130 252)">SSH 22</text>
  <line x1="160" y1="248" x2="112" y2="248" stroke="#333" stroke-width="1.4" marker-end="url(#a2)"/>

  <!-- boundary firewall -->
  <g transform="rotate(-0.45 300 316)">
    <rect x="180" y="300" width="240" height="30" fill="#d9534f" fill-opacity="0.12" stroke="#d9534f" stroke-width="1.8" rx="4"/>
    <text x="300" y="320" text-anchor="middle" font-size="12" fill="#d9534f">工业防火墙 tcp/502 白名单</text>
  </g>

  <line x1="300" y1="330" x2="300" y2="378" stroke="#333" stroke-width="2" marker-end="url(#a2)"/>

  <!-- RTU / PLC row -->
  <g transform="rotate(0.3 170 424)">
    <rect x="90" y="382" width="160" height="84" fill="none" stroke="#333" stroke-width="2.2" rx="6"/>
    <text x="170" y="408" text-anchor="middle" font-size="13" fill="#333">WT01-RTU</text>
    <text x="170" y="428" text-anchor="middle" font-size="11" fill="#666">10.0.5.6:502</text>
    <text x="170" y="448" text-anchor="middle" font-size="10" fill="#888">Unit ID=1</text>
  </g>
  <g transform="rotate(-0.35 400 424)">
    <rect x="320" y="382" width="160" height="84" fill="none" stroke="#333" stroke-width="2.2" rx="6"/>
    <text x="400" y="408" text-anchor="middle" font-size="13" fill="#333">WT02-RTU</text>
    <text x="400" y="428" text-anchor="middle" font-size="11" fill="#666">10.0.5.4:502</text>
    <text x="400" y="448" text-anchor="middle" font-size="10" fill="#888">Unit ID=1</text>
  </g>
  <g transform="rotate(0.4 630 424)">
    <rect x="550" y="382" width="160" height="84" fill="none" stroke="#333" stroke-width="2.2" rx="6"/>
    <text x="630" y="408" text-anchor="middle" font-size="13" fill="#333">WT03-RTU</text>
    <text x="630" y="428" text-anchor="middle" font-size="11" fill="#666">10.0.5.5:502</text>
    <text x="630" y="448" text-anchor="middle" font-size="10" fill="#888">Unit ID=1</text>
  </g>
  <line x1="250" y1="378" x2="300" y2="378" stroke="#333" stroke-width="1.6"/>
  <line x1="300" y1="378" x2="630" y2="378" stroke="#333" stroke-width="1.6"/>
  <line x1="170" y1="378" x2="170" y2="382" stroke="#333" stroke-width="1.6"/>
  <line x1="400" y1="378" x2="400" y2="382" stroke="#333" stroke-width="1.6"/>
  <line x1="630" y1="378" x2="630" y2="382" stroke="#333" stroke-width="1.6"/>

  <text x="300" y="372" text-anchor="middle" font-size="10" fill="#888">Modbus TCP / FC03 读 · FC06 写</text>

  <!-- turbines -->
  <g transform="rotate(-0.3 170 520)">
    <rect x="95" y="490" width="150" height="58" fill="#2c7fb8" fill-opacity="0.07" stroke="#2c7fb8" stroke-width="2" rx="6"/>
    <text x="170" y="515" text-anchor="middle" font-size="12" fill="#2c7fb8">WT01 风机</text>
    <text x="170" y="535" text-anchor="middle" font-size="10" fill="#666">HR93 有功限值</text>
  </g>
  <g transform="rotate(0.35 400 520)">
    <rect x="325" y="490" width="150" height="58" fill="#2c7fb8" fill-opacity="0.07" stroke="#2c7fb8" stroke-width="2" rx="6"/>
    <text x="400" y="515" text-anchor="middle" font-size="12" fill="#2c7fb8">WT02 风机</text>
    <text x="400" y="535" text-anchor="middle" font-size="10" fill="#666">HR93 有功限值</text>
  </g>
  <g transform="rotate(-0.4 630 520)">
    <rect x="555" y="490" width="150" height="58" fill="#2c7fb8" fill-opacity="0.07" stroke="#2c7fb8" stroke-width="2" rx="6"/>
    <text x="630" y="515" text-anchor="middle" font-size="12" fill="#2c7fb8">WT03 风机</text>
    <text x="630" y="535" text-anchor="middle" font-size="10" fill="#666">HR93 有功限值</text>
  </g>
  <line x1="170" y1="466" x2="170" y2="490" stroke="#2c7fb8" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="400" y1="466" x2="400" y2="490" stroke="#2c7fb8" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="630" y1="466" x2="630" y2="490" stroke="#2c7fb8" stroke-width="1.6" marker-end="url(#a3)"/>

  <!-- side nodes: historian, engineer station, integrity node -->
  <g transform="rotate(0.4 790 262)">
    <rect x="700" y="224" width="170" height="76" fill="none" stroke="#333" stroke-width="1.8" stroke-dasharray="6 4" rx="6"/>
    <text x="785" y="250" text-anchor="middle" font-size="12" fill="#333">Historian 历史库</text>
    <text x="785" y="270" text-anchor="middle" font-size="10" fill="#666">长期存储 / 趋势</text>
    <text x="785" y="288" text-anchor="middle" font-size="10" fill="#666">旁挂 · 只读</text>
  </g>
  <line x1="700" y1="262" x2="452" y2="262" stroke="#333" stroke-width="1.3" stroke-dasharray="5 4"/>

  <g transform="rotate(-0.4 790 400)">
    <rect x="700" y="362" width="170" height="76" fill="none" stroke="#333" stroke-width="1.8" stroke-dasharray="6 4" rx="6"/>
    <text x="785" y="388" text-anchor="middle" font-size="12" fill="#333">工程师站 EWS</text>
    <text x="785" y="408" text-anchor="middle" font-size="10" fill="#666">组态 / 下装 / 诊断</text>
    <text x="785" y="426" text-anchor="middle" font-size="10" fill="#888">高权限旁挂</text>
  </g>
  <line x1="700" y1="400" x2="452" y2="400" stroke="#333" stroke-width="1.3" stroke-dasharray="5 4"/>

  <g transform="rotate(0.35 790 530)">
    <rect x="700" y="492" width="170" height="76" fill="#d9534f" fill-opacity="0.06" stroke="#d9534f" stroke-width="1.8" stroke-dasharray="6 4" rx="6"/>
    <text x="785" y="516" text-anchor="middle" font-size="12" fill="#d9534f">校验节点 10.0.5.7</text>
    <text x="785" y="536" text-anchor="middle" font-size="10" fill="#666">HMAC 验签 / 完整性</text>
    <text x="785" y="554" text-anchor="middle" font-size="10" fill="#888">旁路 · 不参与控制</text>
  </g>
  <line x1="700" y1="530" x2="660" y2="530" stroke="#d9534f" stroke-width="1.3" stroke-dasharray="5 4"/>

  <text x="450" y="590" text-anchor="middle" font-size="11" fill="#888">攻击面：管理层入口（Web）→ 网关凭据 → 控制层协议 → 现场层设备</text>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#333"/>
    </marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2c7fb8"/>
    </marker>
  </defs>
</svg>
