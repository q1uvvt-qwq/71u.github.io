<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#fafafa"/>

  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">漏洞复现的标准流程</text>
  <text x="480" y="58" text-anchor="middle" font-size="12.5" fill="#6b7280">四个阶段依次走完，才算真正「复现」了一个漏洞，而不只是「打通」了它</text>

  <!-- 阶段 1 -->
  <rect x="30" y="92" width="200" height="176" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="130" y="122" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1e3a8a">① 确定目标</text>
  <text x="130" y="152" text-anchor="middle" font-size="11.5" fill="#1e40af">锁定组件与漏洞版本</text>
  <text x="130" y="174" text-anchor="middle" font-size="11.5" fill="#1e40af">明确漏洞成立的前提</text>
  <text x="130" y="210" text-anchor="middle" font-size="10.5" fill="#3730a3">产出：</text>
  <text x="130" y="230" text-anchor="middle" font-size="10.5" fill="#3730a3">漏洞描述 + 影响版本区间</text>

  <path d="M232,180 L254,180" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ar)" fill="none"/>

  <!-- 阶段 2 -->
  <rect x="260" y="92" width="200" height="176" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="360" y="122" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#4c1d95">② 复现环境</text>
  <text x="360" y="152" text-anchor="middle" font-size="11.5" fill="#5b21b6">拉源码 / 装指定版本</text>
  <text x="360" y="174" text-anchor="middle" font-size="11.5" fill="#5b21b6">隔离网络、可随时快照</text>
  <text x="360" y="210" text-anchor="middle" font-size="10.5" fill="#5b21b6">产出：</text>
  <text x="360" y="230" text-anchor="middle" font-size="10.5" fill="#5b21b6">可回滚、可重复的靶场</text>

  <path d="M462,180 L484,180" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ar)" fill="none"/>

  <!-- 阶段 3 -->
  <rect x="490" y="92" width="200" height="176" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.6"/>
  <text x="590" y="122" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#713f12">③ 验证漏洞</text>
  <text x="590" y="152" text-anchor="middle" font-size="11.5" fill="#854d0e">发送 PoC，观察回显</text>
  <text x="590" y="174" text-anchor="middle" font-size="11.5" fill="#854d0e">查日志 / 进程 / 落盘文件</text>
  <text x="590" y="210" text-anchor="middle" font-size="10.5" fill="#854d0e">产出：</text>
  <text x="590" y="230" text-anchor="middle" font-size="10.5" fill="#854d0e">可重复的成功记录</text>

  <path d="M692,180 L714,180" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ar)" fill="none"/>

  <!-- 阶段 4 -->
  <rect x="720" y="92" width="210" height="176" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.6"/>
  <text x="825" y="122" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#14532d">④ 评估影响</text>
  <text x="825" y="152" text-anchor="middle" font-size="11.5" fill="#166534">影响程度 / 利用难度</text>
  <text x="825" y="174" text-anchor="middle" font-size="11.5" fill="#166534">影响范围（版本、配置）</text>
  <text x="825" y="210" text-anchor="middle" font-size="10.5" fill="#166534">产出：</text>
  <text x="825" y="230" text-anchor="middle" font-size="10.5" fill="#166534">风险结论 + 修复建议</text>

  <!-- 打靶 vs 复现 -->
  <text x="480" y="304" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111827">复现 ≠ 打靶</text>

  <rect x="60" y="322" width="400" height="112" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="260" y="348" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7f1d1d">打靶（get flag / get shell）</text>
  <text x="260" y="374" text-anchor="middle" font-size="11.5" fill="#991b1b">只关心「能不能进去」，路径不唯一</text>
  <text x="260" y="396" text-anchor="middle" font-size="11.5" fill="#991b1b">失败可以换思路、换工具，不必解释原因</text>
  <text x="260" y="418" text-anchor="middle" font-size="11.5" fill="#991b1b">结果导向，拿到东西就结束</text>

  <rect x="500" y="322" width="400" height="112" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.6"/>
  <text x="700" y="348" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">复现（explain why it works）</text>
  <text x="700" y="374" text-anchor="middle" font-size="11.5" fill="#166534">必须讲清每一步「为什么」成立</text>
  <text x="700" y="396" text-anchor="middle" font-size="11.5" fill="#166534">必须知道「去掉哪个条件就不成立」</text>
  <text x="700" y="418" text-anchor="middle" font-size="11.5" fill="#166534">结论导向，能解释、能重演、能评估</text>

  <!-- 结论 -->
  <rect x="80" y="462" width="800" height="72" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="480" y="490" text-anchor="middle" font-size="13" fill="#1e293b">复现的价值在于：把「侥幸打通」变成「可解释、可复现、可评估」的结论</text>
  <text x="480" y="514" text-anchor="middle" font-size="11.5" fill="#475569">顺序不可颠倒 —— 先确定目标版本，再造环境，再验证触发，最后才谈影响与修复</text>
</svg>
