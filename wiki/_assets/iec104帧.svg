<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="monospace">
  <rect x="0" y="0" width="880" height="620" fill="#ffffff"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" fill="#333" letter-spacing="1">IEC 60870-5-104 帧结构（APCI + ASDU）</text>
  <line x1="150" y1="52" x2="730" y2="52" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

  <!-- APCI -->
  <text x="60" y="92" font-size="14" fill="#2c7fb8">APCI · 应用规约控制信息（6 字节）</text>
  <g transform="rotate(-0.3 200 170)">
    <rect x="60" y="105" width="90" height="76" fill="#2c7fb8" fill-opacity="0.10" stroke="#2c7fb8" stroke-width="2.2" rx="5"/>
    <text x="105" y="132" text-anchor="middle" font-size="14" fill="#2c7fb8">0x68</text>
    <text x="105" y="152" text-anchor="middle" font-size="10" fill="#666">起始字节</text>
    <text x="105" y="170" text-anchor="middle" font-size="11" fill="#333">1 字节</text>
  </g>
  <g transform="rotate(0.35 200 170)">
    <rect x="158" y="105" width="100" height="76" fill="#2c7fb8" fill-opacity="0.10" stroke="#2c7fb8" stroke-width="2.2" rx="5"/>
    <text x="208" y="132" text-anchor="middle" font-size="12" fill="#2c7fb8">长度</text>
    <text x="208" y="152" text-anchor="middle" font-size="10" fill="#666">APDU 长度</text>
    <text x="208" y="170" text-anchor="middle" font-size="11" fill="#333">1 字节</text>
  </g>
  <g transform="rotate(-0.4 360 170)">
    <rect x="266" y="105" width="250" height="76" fill="#2c7fb8" fill-opacity="0.10" stroke="#2c7fb8" stroke-width="2.2" rx="5"/>
    <text x="391" y="132" text-anchor="middle" font-size="13" fill="#2c7fb8">控制域 4 字节</text>
    <text x="391" y="152" text-anchor="middle" font-size="10" fill="#666">I / S / U 三种格式</text>
    <text x="391" y="170" text-anchor="middle" font-size="10" fill="#333">0x68 后的第 3..6 字节</text>
  </g>
  <g transform="rotate(0.3 620 170)">
    <rect x="524" y="105" width="296" height="76" fill="#d9534f" fill-opacity="0.08" stroke="#d9534f" stroke-width="2.2" rx="5"/>
    <text x="672" y="132" text-anchor="middle" font-size="13" fill="#d9534f">ASDU · 应用服务数据单元</text>
    <text x="672" y="152" text-anchor="middle" font-size="10" fill="#666">TypeID / VSQ / COT / OA / CA / IOA / 信息体</text>
    <text x="672" y="170" text-anchor="middle" font-size="10" fill="#333">长度 = APDU 长度 − 4</text>
  </g>

  <!-- three control field formats -->
  <text x="60" y="222" font-size="13" fill="#333">控制域三种格式</text>
  <g transform="rotate(-0.35 180 285)">
    <rect x="60" y="234" width="240" height="106" fill="none" stroke="#333" stroke-width="1.8" rx="5"/>
    <text x="180" y="256" text-anchor="middle" font-size="13" fill="#2c7fb8">I 格式（信息传输）</text>
    <text x="180" y="278" text-anchor="middle" font-size="11" fill="#333">N(S) 发送序号 15 bit</text>
    <text x="180" y="296" text-anchor="middle" font-size="11" fill="#333">N(R) 接收序号 15 bit</text>
    <text x="180" y="318" text-anchor="middle" font-size="10" fill="#888">最低位 bit0 = 0</text>
    <text x="180" y="334" text-anchor="middle" font-size="10" fill="#888">带 ASDU，承载遥测/遥控</text>
  </g>
  <g transform="rotate(0.4 440 285)">
    <rect x="320" y="234" width="240" height="106" fill="none" stroke="#333" stroke-width="1.8" rx="5"/>
    <text x="440" y="256" text-anchor="middle" font-size="13" fill="#2c7fb8">S 格式（确认）</text>
    <text x="440" y="278" text-anchor="middle" font-size="11" fill="#333">01 00 | N(R) 接收序号</text>
    <text x="440" y="296" text-anchor="middle" font-size="11" fill="#333">第 1 字节 = 0x01</text>
    <text x="440" y="318" text-anchor="middle" font-size="10" fill="#888">不带 ASDU</text>
    <text x="440" y="334" text-anchor="middle" font-size="10" fill="#888">仅确认已收到的 I 帧</text>
  </g>
  <g transform="rotate(-0.3 700 285)">
    <rect x="580" y="234" width="240" height="106" fill="none" stroke="#333" stroke-width="1.8" rx="5"/>
    <text x="700" y="256" text-anchor="middle" font-size="13" fill="#2c7fb8">U 格式（链路控制）</text>
    <text x="700" y="276" text-anchor="middle" font-size="10" fill="#333">0x07 STARTDT act / 0x0B con</text>
    <text x="700" y="294" text-anchor="middle" font-size="10" fill="#333">0x13 STOPDT act / 0x23 con</text>
    <text x="700" y="312" text-anchor="middle" font-size="10" fill="#333">0x43 TESTFR act / 0x83 con</text>
    <text x="700" y="332" text-anchor="middle" font-size="10" fill="#888">第 1 字节 = 0x03 | 0x07</text>
  </g>

  <!-- ASDU fields -->
  <text x="60" y="378" font-size="13" fill="#333">ASDU 字段（以 C_SC_NA_1 单点遥控为例）</text>
  <g transform="rotate(-0.25 105 440)">
    <rect x="60" y="392" width="80" height="84" fill="#d9534f" fill-opacity="0.08" stroke="#d9534f" stroke-width="2" rx="5"/>
    <text x="100" y="422" text-anchor="middle" font-size="12" fill="#d9534f">TypeID</text>
    <text x="100" y="442" text-anchor="middle" font-size="11" fill="#333">1 字节</text>
    <text x="100" y="460" text-anchor="middle" font-size="10" fill="#888">45=C_SC_NA_1</text>
  </g>
  <g transform="rotate(0.3 218 440)">
    <rect x="148" y="392" width="62" height="84" fill="none" stroke="#333" stroke-width="1.8" rx="5"/>
    <text x="179" y="422" text-anchor="middle" font-size="12" fill="#333">VSQ</text>
    <text x="179" y="442" text-anchor="middle" font-size="11" fill="#333">1 字节</text>
    <text x="179" y="460" text-anchor="middle" font-size="10" fill="#888">SQ+数量</text>
  </g>
  <g transform="rotate(-0.35 290 440)">
    <rect x="218" y="392" width="82" height="84" fill="#d9534f" fill-opacity="0.08" stroke="#d9534f" stroke-width="2" rx="5"/>
    <text x="259" y="422" text-anchor="middle" font-size="12" fill="#d9534f">COT</text>
    <text x="259" y="442" text-anchor="middle" font-size="11" fill="#333">2 字节</text>
    <text x="259" y="460" text-anchor="middle" font-size="10" fill="#888">6=activation</text>
  </g>
  <g transform="rotate(0.35 350 440)">
    <rect x="308" y="392" width="62" height="84" fill="none" stroke="#333" stroke-width="1.8" rx="5"/>
    <text x="339" y="422" text-anchor="middle" font-size="12" fill="#333">OA</text>
    <text x="339" y="442" text-anchor="middle" font-size="11" fill="#333">1 字节</text>
    <text x="339" y="460" text-anchor="middle" font-size="10" fill="#888">源发站</text>
  </g>
  <g transform="rotate(-0.3 420 440)">
    <rect x="378" y="392" width="82" height="84" fill="#d9534f" fill-opacity="0.08" stroke="#d9534f" stroke-width="2" rx="5"/>
    <text x="419" y="422" text-anchor="middle" font-size="12" fill="#d9534f">CA</text>
    <text x="419" y="442" text-anchor="middle" font-size="11" fill="#333">2 字节</text>
    <text x="419" y="460" text-anchor="middle" font-size="10" fill="#888">站地址=3</text>
  </g>
  <g transform="rotate(0.3 500 440)">
    <rect x="468" y="392" width="90" height="84" fill="#d9534f" fill-opacity="0.08" stroke="#d9534f" stroke-width="2" rx="5"/>
    <text x="513" y="422" text-anchor="middle" font-size="12" fill="#d9534f">IOA</text>
    <text x="513" y="442" text-anchor="middle" font-size="11" fill="#333">3 字节</text>
    <text x="513" y="460" text-anchor="middle" font-size="10" fill="#888">10490</text>
  </g>
  <g transform="rotate(-0.35 690 440)">
    <rect x="566" y="392" width="254" height="84" fill="#2c7fb8" fill-opacity="0.08" stroke="#2c7fb8" stroke-width="2" rx="5"/>
    <text x="693" y="422" text-anchor="middle" font-size="12" fill="#2c7fb8">信息体 Information Object</text>
    <text x="693" y="442" text-anchor="middle" font-size="10" fill="#333">C_SC_NA_1 -> SCO 1 字节</text>
    <text x="693" y="460" text-anchor="middle" font-size="10" fill="#888">bit7 S/E 选择位　bit0 SCS 状态值</text>
  </g>

  <!-- real frame decomposition -->
  <text x="60" y="516" font-size="13" fill="#333">靶场实测 Select 帧逐字节拆解</text>
  <g transform="rotate(0.3 440 556)">
    <rect x="60" y="528" width="760" height="66" fill="none" stroke="#333" stroke-width="1.8" rx="5"/>
    <text x="76" y="552" font-size="13" fill="#2c7fb8">68</text>
    <text x="106" y="552" font-size="13" fill="#2c7fb8">0e</text>
    <text x="140" y="552" font-size="13" fill="#333">00 00 00 00</text>
    <text x="266" y="552" font-size="13" fill="#d9534f">2d</text>
    <text x="296" y="552" font-size="13" fill="#333">01</text>
    <text x="326" y="552" font-size="13" fill="#333">06 00</text>
    <text x="386" y="552" font-size="13" fill="#333">00</text>
    <text x="416" y="552" font-size="13" fill="#333">00 03</text>
    <text x="476" y="552" font-size="13" fill="#d9534f">00 28 fa</text>
    <text x="566" y="552" font-size="13" fill="#d9534f">80</text>
    <text x="596" y="552" font-size="13" fill="#333">= 680e000000002d01060003000028fa80</text>
    <text x="76" y="576" font-size="10" fill="#888">起始</text>
    <text x="104" y="576" font-size="10" fill="#888">长度14</text>
    <text x="176" y="576" font-size="10" fill="#888">控制域 I 格式 N(S)=0 N(R)=0</text>
    <text x="264" y="576" font-size="10" fill="#888">TypeID=45</text>
    <text x="378" y="576" font-size="10" fill="#888">OA=0  CA=3  IOA=10490  SCO=0x80(Select,SCS=0)</text>
  </g>
</svg>
