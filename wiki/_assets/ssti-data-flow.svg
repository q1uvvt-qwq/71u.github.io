<svg xmlns="http://www.w3.org/2000/svg" width="940" height="680" viewBox="0 0 940 680" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="940" height="680" fill="#fafafa"/>

  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">SSTI 数据流：用户输入如何变成被执行的代码</text>
  <text x="470" y="60" text-anchor="middle" font-size="12.5" fill="#6b7280">模板引擎会主动区分「普通文本」和「表达式」，落在 {{ }} 里的内容一律被当作代码求值</text>

  <!-- 1 -->
  <rect x="190" y="88" width="560" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="470" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">① 用户可控输入</text>
  <text x="470" y="134" text-anchor="middle" font-size="12" fill="#1e40af">GET /?name={{7*7}}</text>

  <path d="M470,148 L470,170" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 2 -->
  <rect x="190" y="172" width="560" height="76" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="470" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#312e81">② 应用把输入拼进模板字符串</text>
  <text x="470" y="218" text-anchor="middle" font-size="12" fill="#3730a3">template = "&lt;body&gt;{}&lt;/body&gt;".format(name)</text>
  <text x="470" y="238" text-anchor="middle" font-size="11" fill="#4338ca">Python 的 format() 只替换 {} ，而 {{7*7}} 原样保留下来</text>

  <path d="M470,248 L470,270" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 3 -->
  <rect x="190" y="272" width="560" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="470" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">③ 交给模板引擎渲染</text>
  <text x="470" y="318" text-anchor="middle" font-size="12" fill="#92400e">render_template_string(template) → Jinja2</text>

  <path d="M470,332 L470,354" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 4 -->
  <rect x="190" y="356" width="560" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.6"/>
  <text x="470" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">④ 引擎做语法分析</text>
  <text x="470" y="402" text-anchor="middle" font-size="12" fill="#166534">&lt;body&gt; … &lt;/body&gt; 是普通文本；{{7*7}} 是表达式</text>

  <path d="M470,416 L470,438" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 5 -->
  <rect x="190" y="440" width="560" height="60" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.6"/>
  <text x="470" y="464" text-anchor="middle" font-size="13" font-weight="bold" fill="#831843">⑤ 表达式被求值</text>
  <text x="470" y="486" text-anchor="middle" font-size="12" fill="#9d174d">7*7 → 49 （如果是 __class__ 之类的表达式，则取到对象/函数）</text>

  <path d="M470,500 L470,522" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 6 -->
  <rect x="190" y="524" width="560" height="60" rx="8" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.6"/>
  <text x="470" y="548" text-anchor="middle" font-size="13" font-weight="bold" fill="#881337">⑥ 结果回填并输出</text>
  <text x="470" y="570" text-anchor="middle" font-size="12" fill="#9f1239">&lt;body&gt;49&lt;/body&gt; —— 求值结果直接出现在页面上</text>

  <!-- analogy -->
  <rect x="120" y="608" width="700" height="56" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="470" y="632" text-anchor="middle" font-size="12.5" fill="#78350f">与 SQL 注入同源：都破坏了「数据 / 代码」的边界 —— 用户输入被放进了本该由代码占据的位置</text>
  <text x="470" y="653" text-anchor="middle" font-size="11" fill="#92400e">SQLi 是把输入拼进 SQL 语句后被数据库解析；SSTI 是把输入拼进模板后被模板引擎解析</text>
</svg>
