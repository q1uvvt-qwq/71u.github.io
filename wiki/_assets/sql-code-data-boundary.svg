<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#fafafa"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">SQL 注入的本质：数据越过边界变成了代码</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#6b7280">解析器只认字符、不认「这是用户数据」——引号一旦被提前闭合，攻击者输入就会被当成 SQL 语法</text>

  <rect x="220" y="74" width="14" height="10" fill="#60a5fa"/>
  <text x="240" y="84" font-size="12" fill="#374151">查询本身的语法（代码）</text>
  <rect x="370" y="74" width="14" height="10" fill="#fb923c"/>
  <text x="390" y="84" font-size="12" fill="#374151">用户数据（本应在引号内）</text>
  <rect x="520" y="74" width="14" height="10" fill="#f87171"/>
  <text x="540" y="84" font-size="12" fill="#374151">逃逸后变成代码的载荷</text>
  <rect x="665" y="74" width="14" height="10" fill="#94a3b8"/>
  <text x="685" y="84" font-size="12" fill="#374151">被注释丢弃的部分</text>

  <!-- ============ Panel A ============ -->
  <rect x="25" y="105" width="465" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="45" y="133" font-size="14" font-weight="bold" fill="#0f172a">① 正常输入：数据被引号关住</text>
  <text x="45" y="152" font-size="12" fill="#64748b">username = admin ，password = x</text>

  <rect x="45" y="162" width="425" height="84" rx="6" fill="#0f172a"/>
  <text x="60" y="186" font-size="13" font-family="Consolas,'Courier New',monospace" fill="#60a5fa" xml:space="preserve">SELECT * FROM users</text>
  <text x="60" y="208" font-size="13" font-family="Consolas,'Courier New',monospace" xml:space="preserve"><tspan fill="#60a5fa">WHERE username = </tspan><tspan fill="#fb923c">'admin'</tspan></text>
  <text x="60" y="230" font-size="13" font-family="Consolas,'Courier New',monospace" xml:space="preserve"><tspan fill="#60a5fa">AND password = </tspan><tspan fill="#fb923c">'x'</tspan></text>

  <path d="M257,246 L257,272" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>

  <rect x="92" y="274" width="330" height="42" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="257" y="293" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5b21b6">MySQL 解析器 · 词法分析</text>
  <text x="257" y="310" text-anchor="middle" font-size="11.5" fill="#6d28d9">把这一串字符切成一个个 token</text>

  <path d="M257,316 L257,342" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>

  <rect x="45" y="344" width="425" height="76" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
  <text x="60" y="368" font-size="12.5" fill="#166534">解析器归类结果：</text>
  <text x="60" y="390" font-size="12" fill="#15803d">'admin'、'x' → 字符串字面量（数据）</text>
  <text x="60" y="410" font-size="12" fill="#15803d">没有任何字符逃出引号</text>

  <rect x="45" y="432" width="425" height="92" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="60" y="458" font-size="13.5" font-weight="bold" fill="#166534">结论：没有注入</text>
  <text x="60" y="482" font-size="12" fill="#374151">攻击者提供的数据全程待在引号内，</text>
  <text x="60" y="502" font-size="12" fill="#374151">解析器只把它当作一个「值」去比较。</text>

  <!-- ============ Panel B ============ -->
  <rect x="510" y="105" width="465" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="530" y="133" font-size="14" font-weight="bold" fill="#0f172a">② 注入输入：引号被提前闭合</text>
  <text x="530" y="152" font-size="12" fill="#64748b">username = admin' OR '1'='1' --</text>

  <rect x="530" y="162" width="425" height="84" rx="6" fill="#0f172a"/>
  <text x="545" y="186" font-size="13" font-family="Consolas,'Courier New',monospace" fill="#60a5fa" xml:space="preserve">SELECT * FROM users</text>
  <text x="545" y="208" font-size="13" font-family="Consolas,'Courier New',monospace" xml:space="preserve"><tspan fill="#60a5fa">WHERE username = </tspan><tspan fill="#fb923c">'admin'</tspan><tspan fill="#f87171"> OR '1'='1'</tspan><tspan fill="#94a3b8"> -- '</tspan></text>
  <text x="545" y="230" font-size="13" font-family="Consolas,'Courier New',monospace" xml:space="preserve"><tspan fill="#94a3b8">AND password = 'x'</tspan></text>

  <path d="M742,246 L742,272" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>

  <rect x="577" y="274" width="330" height="42" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="742" y="293" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5b21b6">MySQL 解析器 · 词法分析</text>
  <text x="742" y="310" text-anchor="middle" font-size="11.5" fill="#6d28d9">同一套规则，它并不知道这是恶意输入</text>

  <path d="M742,316 L742,342" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>

  <rect x="530" y="344" width="425" height="76" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="545" y="368" font-size="12.5" fill="#991b1b">解析器重新归类：</text>
  <text x="545" y="390" font-size="12" fill="#b91c1c">OR '1'='1' → 被识别为查询逻辑（代码）</text>
  <text x="545" y="410" font-size="12" fill="#b91c1c">-- 之后 → 被当成注释，密码校验被丢弃</text>

  <rect x="530" y="432" width="425" height="92" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="545" y="458" font-size="13.5" font-weight="bold" fill="#991b1b">结论：注入成立</text>
  <text x="545" y="482" font-size="12" fill="#374151">本应是「值」的输入逃出了引号，</text>
  <text x="545" y="502" font-size="12" fill="#374151">被解析器当成语法 → WHERE 条件恒真。</text>

  <!-- ============ Bottom band ============ -->
  <rect x="25" y="560" width="950" height="66" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="45" y="586" font-size="13" fill="#78350f">本质：SQL 注入不是「数据库被黑」，而是「字符串被错误地重新分词」——</text>
  <text x="45" y="610" font-size="13" fill="#92400e">代码与数据的边界只由引号（与括号）划定；谁抢先闭合引号，谁就重新定义了这条边界。</text>
</svg>
