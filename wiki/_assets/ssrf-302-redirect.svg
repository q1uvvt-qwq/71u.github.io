<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#fafafa"/>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">302 重定向绕过：校验只做一次，跳转后没人再看一眼</text>
  <text x="490" y="58" text-anchor="middle" font-size="12.5" fill="#6b7280">把「第一次请求的目标」做成一个合法的公网地址，把「真正的目标」藏在 Location 里</text>

  <!-- lanes -->
  <rect x="30" y="82" width="200" height="420" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="130" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">攻击者</text>

  <rect x="260" y="82" width="230" height="420" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="375" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">靶机（有 SSRF + 校验）</text>

  <rect x="520" y="82" width="200" height="420" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.4"/>
  <text x="620" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#78350f">攻击者的公网服务器</text>
  <text x="620" y="126" text-anchor="middle" font-size="10.5" fill="#92400e">（黑名单里它是「合法」的）</text>

  <rect x="750" y="82" width="200" height="420" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="850" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">靶机本机 / 内网</text>

  <!-- step 1 -->
  <rect x="45" y="148" width="170" height="52" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="130" y="170" text-anchor="middle" font-size="11" fill="#1e3a8a">提交 url=</text>
  <text x="130" y="188" text-anchor="middle" font-size="10.5" fill="#1e40af">http://攻击者IP/redirect</text>
  <path d="M215,174 L318,174" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <text x="266" y="166" text-anchor="middle" font-size="10" fill="#166534">① 入门请求</text>

  <!-- step 2 check -->
  <rect x="278" y="206" width="194" height="64" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3"/>
  <text x="375" y="228" text-anchor="middle" font-size="11" fill="#7f1d1d">校验：解析 host 得到 IP</text>
  <text x="375" y="246" text-anchor="middle" font-size="11" fill="#7f1d1d">是公网 IP → 放行</text>
  <text x="375" y="264" text-anchor="middle" font-size="10.5" fill="#991b1b">（此时看不到 127.0.0.1）</text>

  <path d="M472,238 L564,238" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowR)"/>
  <text x="518" y="230" text-anchor="middle" font-size="10" fill="#b91c1c">② 真的去请求</text>

  <!-- step 3 302 -->
  <rect x="536" y="280" width="168" height="66" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="620" y="302" text-anchor="middle" font-size="10.5" font-family="Consolas,monospace" fill="#78350f">302 Found</text>
  <text x="620" y="320" text-anchor="middle" font-size="10.5" font-family="Consolas,monospace" fill="#78350f">Location:</text>
  <text x="620" y="337" text-anchor="middle" font-size="10.5" font-family="Consolas,monospace" fill="#78350f">http://127.0.0.1/flag.php</text>

  <path d="M536,340 L472,340" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="504" y="332" text-anchor="middle" font-size="10" fill="#334155">③ 回显跳转</text>

  <!-- step 4 follow -->
  <rect x="278" y="368" width="194" height="64" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3"/>
  <text x="375" y="390" text-anchor="middle" font-size="11" fill="#7f1d1d">自动跟随跳转</text>
  <text x="375" y="408" text-anchor="middle" font-size="11" fill="#7f1d1d">直接去连 127.0.0.1</text>
  <text x="375" y="426" text-anchor="middle" font-size="10.5" fill="#991b1b">不再重复第 2 步的校验</text>

  <path d="M472,400 L786,400" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowR)"/>
  <text x="629" y="392" text-anchor="middle" font-size="10" fill="#b91c1c">④ 这次目标是内网</text>

  <!-- step 5 data -->
  <rect x="776" y="368" width="150" height="64" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.3"/>
  <text x="851" y="392" text-anchor="middle" font-size="11" fill="#14532d">本机 80 端口服务</text>
  <text x="851" y="410" text-anchor="middle" font-size="11" fill="#14532d">返回 flag.php</text>
  <text x="851" y="426" text-anchor="middle" font-size="10.5" fill="#166534">它只信「本机来源」</text>

  <path d="M776,456 L302,456" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  <text x="540" y="449" text-anchor="middle" font-size="10" fill="#1e40af">⑤ 内容沿原路回显</text>

  <path d="M302,470 L218,470" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/>

  <!-- conclusion -->
  <rect x="90" y="518" width="800" height="76" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="490" y="543" text-anchor="middle" font-size="12.5" fill="#78350f">关键差别：校验代码作用在「用户提交的那个 URL」上，而不是「最终被访问的那个地址」上</text>
  <text x="490" y="565" text-anchor="middle" font-size="11.5" fill="#92400e">只要中间有一次跳转，后续请求就完全脱离了检查；cURL 默认 CURLOPT_FOLLOWLOCATION=0 不跟，跟了才有这条攻击链</text>
  <text x="490" y="586" text-anchor="middle" font-size="11.5" fill="#6b7280">前提：攻击者必须有一台公网可达、能自定义响应的服务器（或任意可控的开放重定向点）</text>
</svg>
